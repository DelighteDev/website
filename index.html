    function ToastNotification({ message, type, onClose }) {
      useEffect(() => {
        const timer = setTimeout(() => onClose(), 4000);
        return () => clearTimeout(timer);
      }, [onClose]);

      return (
        <div className="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 flex items-center gap-3 bg-slate-900/95 dark:bg-white/95 text-white dark:text-slate-900 px-5 py-3 rounded-2xl shadow-2xl border border-slate-700/50 backdrop-blur-md animate-slide-down">

            <Icons.Check className="w-4 h-4" />
          </div>
          <p className="text-sm font-medium">{message}</p>
          <button onClick={onClose} className="text-slate-400 hover:text-white dark:hover:text-slate-900 transition-colors ml-2">
            <Icons.Close className="w-4 h-4" />
          </button>
        </div>
      );
    }

    // ==========================================
    // HEADER COMPONENT (Search Bar, Contact, Menu)
    // ==========================================
    function Header({ onOpenContact, searchQuery, setSearchQuery, isDark, toggleTheme }) {
      const [isMobileMenuOpen, setIsMobileMenuOpen] = useState(false);
      const [isSearchFocused, setIsSearchFocused] = useState(false);
      const [showMobileSearch, setShowMobileSearch] = useState(false);
      const searchRef = useRef(null);

      // Keyboard shortcut "/" to focus search
      useEffect(() => {
        const handleKeyDown = (e) => {
          if (e.key === "/" && document.activeElement !== searchRef.current && document.activeElement?.tagName !== "INPUT" && document.activeElement?.tagName !== "TEXTAREA") {
            e.preventDefault();
            searchRef.current?.focus();
          }
          if (e.key === "Escape") {
            setIsSearchFocused(false);
            setShowMobileSearch(false);
          }
        };
        window.addEventListener("keydown", handleKeyDown);
        return () => window.removeEventListener("keydown", handleKeyDown);
      }, []);

      // Filtered search results
      const searchResults = useMemo(() => {
        if (!searchQuery.trim()) return [];
        const q = searchQuery.toLowerCase();
        return SEARCHABLE_CONTENT.filter(item => 
          item.title.toLowerCase().includes(q) || item.category.toLowerCase().includes(q) || item.type.toLowerCase().includes(q)
        );
      }, [searchQuery]);

      const handleSelectResult = (item) => {
        setSearchQuery("");
        setIsSearchFocused(false);
        setShowMobileSearch(false);
        if (item.action === "openContact") {
          onOpenContact();
        } else if (item.action === "toggleTheme") {
          toggleTheme();
        } else if (item.targetId) {
          const el = document.getElementById(item.targetId);
          if (el) {
            el.scrollIntoView({ behavior: "smooth" });
          }
        }
      };

    // ==========================================
    // CAROUSEL COMPONENT (Royalty-free photos)
    // ==========================================
    function PhotoCarousel({ onTriggerToast }) {
      const [currentIndex, setCurrentIndex] = useState(0);
      const [isPlaying, setIsPlaying] = useState(true);
      const [isFullscreen, setIsFullscreen] = useState(false);
      const touchStartX = useRef(0);
      const touchEndX = useRef(0);
      const totalSlides = CAROUSEL_SLIDES.length;

      // Autoplay timer
      useEffect(() => {
        if (!isPlaying) return;
        const interval = setInterval(() => {
          setCurrentIndex((prev) => (prev + 1) % totalSlides);
        }, 5000);
        return () => clearInterval(interval);
      }, [isPlaying, totalSlides]);

      const prevSlide = useCallback(() => {
        setCurrentIndex((prev) => (prev - 1 + totalSlides) % totalSlides);
      }, [totalSlides]);

      const nextSlide = useCallback(() => {
        setCurrentIndex((prev) => (prev + 1) % totalSlides);
      }, [totalSlides]);

      // Keyboard navigation
      useEffect(() => {
        const handleKeyDown = (e) => {
          if (e.key === "ArrowLeft") prevSlide();
          if (e.key === "ArrowRight") nextSlide();
          if (e.key === "Escape" && isFullscreen) setIsFullscreen(false);
        };
        window.addEventListener("keydown", handleKeyDown);
        return () => window.removeEventListener("keydown", handleKeyDown);
      }, [prevSlide, nextSlide, isFullscreen]);

      // Touch swipe gestures for mobile
      const handleTouchStart = (e) => {
        touchStartX.current = e.targetTouches[0].clientX;
      };

      const handleTouchMove = (e) => {
        touchEndX.current = e.targetTouches[0].clientX;
      };

      const handleTouchEnd = () => {
        if (!touchStartX.current || !touchEndX.current) return;
        const diff = touchStartX.current - touchEndX.current;
        if (diff > 50) {
          nextSlide(); // swipe left -> next
        } else if (diff < -50) {
          prevSlide(); // swipe right -> prev
        }
        touchStartX.current = 0;
        touchEndX.current = 0;
      };

      const current = CAROUSEL_SLIDES[currentIndex];

      return (
        <section id="carousel" className="py-12 sm:py-16 scroll-mt-20">
          <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            
            {/* Section Header */}
            <div className="flex flex-col md:flex-row md:items-end justify-between mb-8 gap-4">
              <div>
                <div className="inline-flex items-center gap-2 text-xs font-bold tracking-wider uppercase text-teal-600 dark:text-teal-400 mb-1">
                  <span>Visual Showcase</span>
                  <span>•</span>
                  <span>Royalty-Free Photography</span>
                </div>
                <h2 className="text-2xl sm:text-3xl font-bold tracking-tight text-slate-900 dark:text-white">
                  High-Resolution Responsive Carousel
                </h2>
                <p className="text-sm text-slate-500 dark:text-slate-400 mt-1 max-w-xl">
                  Swipeable on mobile devices, keyboard-accessible with arrow keys, autoplay controls, and photographer attribution.
                </p>
              </div>

              {/* Slide Counter & Playback Controls */}
              <div className="flex items-center gap-3 self-start md:self-auto">
                <div className="text-xs font-mono px-3 py-1.5 rounded-lg bg-slate-200/80 dark:bg-slate-800/80 text-slate-700 dark:text-slate-300 font-medium">
                  {String(currentIndex + 1).padStart(2, '0')} / {String(totalSlides).padStart(2, '0')}
                </div>
                
                <button
                  onClick={() => setIsPlaying(!isPlaying)}
                  className={`flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-semibold transition-all ${
                    isPlaying 
                      ? "bg-teal-500/10 text-teal-700 dark:text-teal-300 border border-teal-500/30" 
                      : "bg-slate-200 dark:bg-slate-800 text-slate-600 dark:text-slate-400"
                  }`}
                  title={isPlaying ? "Pause autoplay" : "Start autoplay"}
                >
                  {isPlaying ? <Icons.Pause className="w-3.5 h-3.5" /> : <Icons.Play className="w-3.5 h-3.5" />}
                  <span>{isPlaying ? "Autoplay ON" : "Paused"}</span>
                </button>
              </div>
            </div>

            {/* Carousel Main Container */}
            <div 
              className="relative rounded-3xl overflow-hidden shadow-2xl bg-slate-900 group select-none transition-all"
              onTouchStart={handleTouchStart}
              onTouchMove={handleTouchMove}
              onTouchEnd={handleTouchEnd}
            >
              {/* Aspect Ratio Container (16:9 on desktop, 4:3 or 16:10 on mobile) */}
              <div className="relative h-[340px] sm:h-[460px] md:h-[540px] w-full overflow-hidden">
                {CAROUSEL_SLIDES.map((slide, idx) => (
                  <div
                    key={slide.id}
                    className={`absolute inset-0 transition-opacity duration-700 ease-in-out ${
                      idx === currentIndex ? "opacity-100 z-10 scale-100" : "opacity-0 z-0 pointer-events-none"
                    }`}
                  >
                    <img
                      src={slide.url}
                      alt={slide.title}
                      className="w-full h-full object-cover object-center transform transition-transform duration-1000 group-hover:scale-105"
                      loading={idx === 0 ? "eager" : "lazy"}
                    />
                    
                    {/* Dark gradient overlay for text readability */}
                    <div className="absolute inset-0 bg-gradient-to-t from-slate-950 via-slate-950/40 to-transparent"></div>
                  </div>
                ))}

                {/* Slide Caption Details (Bottom Left) */}
                <div className="absolute bottom-0 left-0 right-0 p-5 sm:p-8 md:p-10 z-20 flex flex-col md:flex-row md:items-end justify-between gap-4">
                  <div className="max-w-2xl animate-fade-in">
                    <div className="flex flex-wrap items-center gap-2 mb-2">
                      <span className="px-2.5 py-0.5 rounded-full text-[11px] font-bold bg-teal-500 text-slate-950 uppercase tracking-wide">
                        {current.badge}
                      </span>
                      <span className="text-xs font-medium text-teal-300">
                        {current.category}
                      </span>
                    </div>

                    <h3 className="text-xl sm:text-2xl md:text-3xl font-extrabold text-white tracking-tight drop-shadow-md">
                      {current.title}
                    </h3>
                    
                    <p className="mt-2 text-xs sm:text-sm text-slate-300 line-clamp-2 drop-shadow">
                      {current.description}
                    </p>

                    <div className="mt-3 flex items-center gap-2 text-xs text-slate-400">
                      <span>Photo by</span>
                      <a
                        href={current.photographerUrl}
                        target="_blank"
                        rel="noreferrer"
                        className="text-white hover:text-teal-400 underline font-medium inline-flex items-center gap-1 transition-colors"
                      >
                        {current.photographer}
                        <Icons.ExternalLink className="w-3 h-3" />
                      </a>
                      <span>on Unsplash (Royalty-free)</span>
                    </div>
                  </div>

                  {/* Fullscreen zoom button */}
                  <div className="flex items-center gap-2">
                    <button
                      onClick={() => setIsFullscreen(true)}
                      className="p-2.5 rounded-xl bg-white/10 hover:bg-white/20 text-white backdrop-blur-md border border-white/20 transition-all hover:scale-105 shadow-md"
                      title="View High-Res Fullscreen"
                    >
                      <Icons.Expand className="w-5 h-5" />
                    </button>
                  </div>
                </div>

                {/* Left Arrow Button */}
                <button
                  onClick={prevSlide}
                  className="absolute left-3 sm:left-5 top-1/2 -translate-y-1/2 z-30 p-2.5 sm:p-3 rounded-full bg-slate-900/60 hover:bg-slate-900/90 text-white backdrop-blur-md border border-white/20 hover:scale-110 active:scale-95 transition-all shadow-xl"
                  aria-label="Previous Slide"
                >
                  <Icons.ChevronLeft className="w-5 h-5 sm:w-6 sm:h-6" />
                </button>

                {/* Right Arrow Button */}
                <button
                  onClick={nextSlide}
                  className="absolute right-3 sm:right-5 top-1/2 -translate-y-1/2 z-30 p-2.5 sm:p-3 rounded-full bg-slate-900/60 hover:bg-slate-900/90 text-white backdrop-blur-md border border-white/20 hover:scale-110 active:scale-95 transition-all shadow-xl"
                  aria-label="Next Slide"
                >
                  <Icons.ChevronRight className="w-5 h-5 sm:w-6 sm:h-6" />
                </button>

                {/* Top Corner Touch indicator for mobile */}
                <div className="sm:hidden absolute top-3 right-3 z-30 px-2 py-1 rounded bg-black/50 text-[10px] text-white/80 font-mono backdrop-blur-sm pointer-events-none">
                  Swipe ↔
                </div>
              </div>

              {/* Carousel Dot Indicators */}
              <div className="bg-slate-950/90 border-t border-slate-800 px-4 py-3 flex items-center justify-between">
                <div className="flex items-center gap-1.5 sm:gap-2">
                  {CAROUSEL_SLIDES.map((_, idx) => (
                    <button
                      key={idx}
                      onClick={() => setCurrentIndex(idx)}
                      className={`h-2 rounded-full transition-all duration-300 ${
                        idx === currentIndex

                          : "w-2 bg-slate-700 hover:bg-slate-500"
                      }`}
                      aria-label={`Jump to slide ${idx + 1}`}
                    />
                  ))}
                </div>

                {/* Quick Thumbnail Strip (Desktop & Tablet) */}
                <div className="hidden sm:flex items-center gap-2">
                  {CAROUSEL_SLIDES.map((slide, idx) => (

    // ==========================================
    // CONTACT MODAL COMPONENT (Header "Contact Me")
    // ==========================================
    function ContactModal({ isOpen, onClose, onTriggerToast }) {
      const [formData, setFormData] = useState({
        name: "",
        email: "",
        subject: "General Feedback",
        urgency: "Normal",
        message: ""
      });
      const [isSubmitting, setIsSubmitting] = useState(false);
      const [isSuccess, setIsSuccess] = useState(false);

      if (!isOpen) return null;

      const handleSubmit = (e) => {
        e.preventDefault();
        setIsSubmitting(true);

        // Simulate network API submission
        setTimeout(() => {
          setIsSubmitting(false);
          setIsSuccess(true);
          onTriggerToast(`Message received from ${formData.name || "User"}!`);
        }, 800);
      };

      const handleReset = () => {
        setIsSuccess(false);
        setFormData({
          name: "",
          email: "",
          subject: "General Feedback",
          urgency: "Normal",
          message: ""
        });
        onClose();
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/70 backdrop-blur-md animate-fade-in">
          <div 
            className="bg-white dark:bg-slate-900 w-full max-w-lg rounded-3xl shadow-2xl border border-slate-200 dark:border-slate-800 overflow-hidden"
            onClick={(e) => e.stopPropagation()}
          >
            {/* Modal Header */}
            <div className="px-6 py-5 border-b border-slate-200 dark:border-slate-800 flex items-center justify-between bg-slate-50 dark:bg-slate-950">
              <div className="flex items-center gap-2.5">
                <div className="w-9 h-9 rounded-xl bg-teal-500/10 text-teal-600 dark:text-teal-400 flex items-center justify-center">
                  <Icons.Mail className="w-5 h-5" />
                </div>
                <div>
                  <h3 className="text-lg font-bold text-slate-900 dark:text-white leading-tight">
                    Contact Me
                  </h3>
                  <p className="text-xs text-slate-500">
                    Header quick contact & test messaging form
                  </p>
                </div>
              </div>
              <button
                onClick={onClose}
                className="p-2 rounded-xl text-slate-400 hover:text-slate-700 dark:hover:text-white hover:bg-slate-200 dark:hover:bg-slate-800 transition-colors"
              >
                <Icons.Close className="w-5 h-5" />
              </button>
            </div>

            {/* Modal Body */}
            <div className="p-6">
              {isSuccess ? (
                <div className="py-8 text-center space-y-4">
                  <div className="w-16 h-16 rounded-full bg-teal-500/20 text-teal-500 flex items-center justify-center mx-auto">
                    <Icons.Check className="w-8 h-8" />
                  </div>
                  <h4 className="text-xl font-bold text-slate-900 dark:text-white">
                    Message Sent Successfully!
                  </h4>
                  <p className="text-sm text-slate-500 max-w-sm mx-auto">
                    Thank you, <span className="font-semibold text-slate-900 dark:text-white">{formData.name || "tester"}</span>. In this prototype sandbox, your submission was validated and recorded in client state.
                  </p>
                  <button
                    onClick={handleReset}
                    className="mt-4 px-6 py-2.5 rounded-xl bg-teal-600 text-white font-semibold text-sm hover:bg-teal-500 transition-colors shadow"
                  >
                    Done & Close
                  </button>
                </div>
              ) : (
                <form onSubmit={handleSubmit} className="space-y-4">
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                      <label className="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">
                        Your Name *
                      </label>
                      <input
                        type="text"
                        required
                        value={formData.name}
                        onChange={(e) => setFormData({ ...formData, name: e.target.value })}
                        placeholder="John Doe"
                        className="w-full px-3.5 py-2 text-sm rounded-xl bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 focus:outline-none focus:ring-2 focus:ring-teal-500"
                      />
                    </div>
                    <div>
                      <label className="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">
                        Email Address *
                      </label>
                      <input
                        type="email"
                        required
                        value={formData.email}
                        onChange={(e) => setFormData({ ...formData, email: e.target.value })}
                        placeholder="john@example.com"
                        className="w-full px-3.5 py-2 text-sm rounded-xl bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 focus:outline-none focus:ring-2 focus:ring-teal-500"
                      />
                    </div>
                  </div>

                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                      <label className="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">
                        Topic / Category
                      </label>
                      <select
                        value={formData.subject}
                        onChange={(e) => setFormData({ ...formData, subject: e.target.value })}
                        className="w-full px-3.5 py-2 text-sm rounded-xl bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 focus:outline-none focus:ring-2 focus:ring-teal-500"
                      >
                        <option>General Feedback</option>
                        <option>Bug Report</option>
                        <option>Carousel Inquiry</option>
                        <option>Media Embed Request</option>
                        <option>Collaboration</option>
                      </select>
                    </div>
                    <div>
                      <label className="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">
                        Priority Level
                      </label>
                      <div className="flex gap-2">
                        {["Normal", "High", "Urgent"].map((p) => (
                          <button
                            type="button"
                            key={p}
                            onClick={() => setFormData({ ...formData, urgency: p })}
                            className={`flex-1 py-1.5 text-xs font-medium rounded-lg border transition-all ${
                              formData.urgency === p
                                ? "bg-teal-500 text-white border-teal-500 font-bold"
                                : "bg-slate-50 dark:bg-slate-950 border-slate-200 dark:border-slate-800 text-slate-600 dark:text-slate-400"
                            }`}
                          >
                            {p}
                          </button>
                        ))}
                      </div>
                    </div>
                  </div>

                  <div>
                    <label className="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">
                      Message *
                    </label>
                    <textarea
                      rows="4"
                      required
                      value={formData.message}
                      onChange={(e) => setFormData({ ...formData, message: e.target.value })}
                      placeholder="Type your message, testing note, or inquiry here..."
                      className="w-full px-3.5 py-2 text-sm rounded-xl bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 focus:outline-none focus:ring-2 focus:ring-teal-500"
                    ></textarea>
                  </div>

                  <div className="pt-2 flex items-center justify-end gap-3">
                    <button
                      type="button"
                      onClick={onClose}
                      className="px-4 py-2 text-sm font-semibold rounded-xl text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors"
                    >
                      Cancel
                    </button>
                    <button
                      type="submit"
                      disabled={isSubmitting}
                      className="px-6 py-2 text-sm font-semibold rounded-xl text-white bg-teal-600 hover:bg-teal-500 shadow-md shadow-teal-600/20 transition-all flex items-center gap-2"
                    >
                      {isSubmitting ? (
                        <>
                          <span className="w-4 h-4 border-2 border-white/30 border-t-white rounded-full animate-spin"></span>
                          <span>Sending...</span>
                        </>
                      ) : (
                        <>
                          <Icons.Mail className="w-4 h-4" />
                          <span>Submit Message</span>
                        </>
                      )}
                    </button>
                  </div>
                </form>
              )}
            </div>
          </div>
        </div>
      );
    }

    // ==========================================
    // FOOTER COMPONENT
    // ==========================================

        setEmail("");
      };

      const scrollToTop = () => {
        window.scrollTo({ top: 0, behavior: "smooth" });
      };

      return (
        <footer className="mt-auto bg-white dark:bg-slate-950 border-t border-slate-200/80 dark:border-slate-800/80">
          <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
            <div className="grid grid-cols-1 md:grid-cols-4 gap-8 mb-10">
              
              {/* Brand Col */}
              <div className="md:col-span-2 space-y-4">
                <div className="flex items-center gap-2.5">
                  <div className="w-8 h-8 rounded-lg bg-teal-600 text-white font-black flex items-center justify-center text-sm">
                    P
                  </div>
                  <span className="font-extrabold text-lg text-slate-900 dark:text-white">
                    Pulse<span className="text-teal-600 dark:text-teal-400">Craft</span>
                  </span>
                </div>
                <p className="text-xs sm:text-sm text-slate-500 dark:text-slate-400 max-w-sm leading-relaxed">
                  Dummy website built with React.js for prototyping, cross-device testing, carousel integration, and embedded media evaluation.
                </p>
                <div className="flex items-center gap-3 text-slate-400">
                  <a href="#media-section" className="hover:text-teal-500 transition-colors"><Icons.Spotify className="w-5 h-5" /></a>
                  <a href="#media-section" className="hover:text-red-500 transition-colors"><Icons.Youtube className="w-5 h-5" /></a>
                  <a href="#media-section" className="hover:text-blue-400 transition-colors"><Icons.Twitter className="w-5 h-5" /></a>
                  <a href="#media-section" className="hover:text-pink-500 transition-colors"><Icons.Instagram className="w-5 h-5" /></a>
                </div>
              </div>

              {/* Quick Links */}
              <div>
                <h4 className="text-xs font-bold uppercase tracking-wider text-slate-900 dark:text-white mb-3">
                  Quick Navigation
                </h4>
                <ul className="space-y-2 text-xs text-slate-600 dark:text-slate-400 font-medium">
                  <li><a href="#carousel" className="hover:text-teal-500 transition-colors">Royalty-Free Carousel</a></li>
                  <li><a href="#media-section" className="hover:text-teal-500 transition-colors">Spotify Embedded Player</a></li>
                  <li><a href="#media-section" className="hover:text-teal-500 transition-colors">YouTube Video Frame</a></li>
                  <li><a href="#test-features" className="hover:text-teal-500 transition-colors">Screen Size Diagnostics</a></li>
                  <li><button onClick={onOpenContact} className="hover:text-teal-500 transition-colors">Contact Modal</button></li>
                </ul>
              </div>

              {/* Mock Newsletter */}
              <div>
                <h4 className="text-xs font-bold uppercase tracking-wider text-slate-900 dark:text-white mb-3">
                  Test Newsletter
                </h4>
                <p className="text-xs text-slate-500 mb-3">
                  Receive simulated updates and mock payloads.
                </p>
                <form onSubmit={handleSubscribe} className="space-y-2">
                  <input
                    type="email"
                    required
                    value={email}
                    onChange={(e) => setEmail(e.target.value)}
                    placeholder="Enter dummy email..."
                    className="w-full px-3 py-2 text-xs rounded-xl bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-800 text-slate-900 dark:text-white focus:outline-none focus:ring-1 focus:ring-teal-500"
                  />
                  <button
                    type="submit"
                    className="w-full py-2 bg-slate-900 dark:bg-teal-600 text-white rounded-xl text-xs font-semibold hover:bg-slate-800 transition-colors shadow"
                  >
                    Subscribe
                  </button>
                </form>
              </div>

            </div>

            {/* Bottom Bar */}
            <div className="pt-6 border-t border-slate-200/80 dark:border-slate-800/80 flex flex-col sm:flex-row items-center justify-between gap-4 text-xs text-slate-500">
              <p>© 2026 PulseCraft Testing Environment. Built for cross-device evaluation.</p>
              
              <div className="flex items-center gap-4">
                <button
                  onClick={scrollToTop}
                  className="hover:text-teal-500 transition-colors font-medium flex items-center gap-1"
                >
                  <span>Back to top</span>
                  <span>↑</span>
                </button>
              </div>
            </div>

          </div>
        </footer>
      );
    }

    // ==========================================
    // MAIN APP COMPONENT
    // ==========================================
    function App() {
      const [isContactOpen, setIsContactOpen] = useState(false);
      const [searchQuery, setSearchQuery] = useState("");
      const [toastMessage, setToastMessage] = useState(null);
      const [isDark, setIsDark] = useState(() => {
        if (typeof window !== "undefined") {
          return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        }
        return false;
      });

      // Synchronize dark mode class on <html>
      useEffect(() => {
        if (isDark) {
          document.documentElement.classList.add("dark");
        } else {
          document.documentElement.classList.remove("dark");
        }
      }, [isDark]);

      const toggleTheme = () => {
        setIsDark(prev => !prev);
      };

      const handleTriggerToast = (msg) => {
        setToastMessage(msg);
      };

      return (
        <div className="flex flex-col min-h-screen">
          {/* Header with Search and Contact Me button */}
          <Header
            onOpenContact={() => setIsContactOpen(true)}
            searchQuery={searchQuery}
            setSearchQuery={setSearchQuery}
            isDark={isDark}
            toggleTheme={toggleTheme}
          />

          {/* Main Content Area */}
          <main className="flex-1">
            <Hero
              onOpenContact={() => setIsContactOpen(true)}
              onTriggerToast={handleTriggerToast}
            />

            {/* Photo Carousel with royalty-free Unsplash photography */}
            <PhotoCarousel
              onTriggerToast={handleTriggerToast}
            />

            {/* Spotify and Social Media Embedding Hub */}
            <MediaSection
              onTriggerToast={handleTriggerToast}
            />

            {/* Diagnostics & Testing Utilities */}
            <TestFeaturesSection
              onOpenContact={() => setIsContactOpen(true)}
              onTriggerToast={handleTriggerToast}
            />
          </main>

          {/* Footer */}
          <Footer
            onOpenContact={() => setIsContactOpen(true)}
            onTriggerToast={handleTriggerToast}
          />

          {/* Contact Me Header Modal */}
          <ContactModal
            isOpen={isContactOpen}
            onClose={() => setIsContactOpen(false)}
            onTriggerToast={handleTriggerToast}
          />

          {/* Toast Notification Popup */}
          {toastMessage && (
            <ToastNotification
              message={toastMessage}
              onClose={() => setToastMessage(null)}
            />
          )}
        </div>
      );
    }

    // Mount to DOM
    const rootElement = document.getElementById("root");
    const root = ReactDOM.createRoot(rootElement);
    root.render(<App />);
  </script>
</body>
